# ── Barchaysite — docker-compose ─────────────────────────────────────────────
#
# Quick start (same-origin mode — nginx proxies API internally):
#   cp .env.example .env        # fill in ADMIN_API_KEY
#   docker compose up -d
#   Open http://localhost
#
# For separate API domain mode — set API_BASE in .env:
#   API_BASE=https://api.yourdomain.com
#
# See docs/DOCKER.md for full VPS deployment instructions.

services:

  # ── Go API server ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      # PUBLIC_URL and ALLOWED_ORIGINS come from .env
    volumes:
      - api_data:/app/data
      - api_uploads:/app/uploads
    networks:
      - barchay
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── nginx + static frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # API_BASE: leave empty to use same-origin nginx proxy (recommended).
      # Set to an external URL if the API is on a different domain.
      API_BASE: "${API_BASE:-}"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - barchay

volumes:
  api_data:
  api_uploads:

networks:
  barchay:
    driver: bridge
